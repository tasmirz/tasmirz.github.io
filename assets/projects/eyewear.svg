<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid-dots-eye" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#3c3836" />
    </pattern>
    <pattern id="grid-cad-eye" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#282828" stroke-width="1" />
    </pattern>
    <linearGradient id="fade-glow-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fabd2f" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#fe8019" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="640" height="360" fill="#1d2021" />
  <rect width="640" height="360" fill="url(#grid-cad-eye)" />
  <rect width="640" height="360" fill="url(#grid-dots-eye)" opacity="0.6" />
  <rect x="24" y="24" width="592" height="312" fill="url(#fade-glow-amber)" rx="4" />

  <!-- Outer Technical CAD Boundary -->
  <rect x="24" y="24" width="592" height="312" fill="none" stroke="#3c3836" stroke-width="1" stroke-dasharray="8 4" />

  <!-- Technical Corner Marks -->
  <path d="M 20 36 L 20 20 L 36 20" fill="none" stroke="#fabd2f" stroke-width="2" />
  <path d="M 620 36 L 620 20 L 604 20" fill="none" stroke="#fabd2f" stroke-width="2" />
  <path d="M 20 324 L 20 340 L 36 340" fill="none" stroke="#fabd2f" stroke-width="2" />
  <path d="M 620 324 L 620 340 L 604 340" fill="none" stroke="#fabd2f" stroke-width="2" />

  <!-- Technical Monospace Headers -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#928374">
    <text x="44" y="52">0x02 // CV.OPTICAL-ASSIST</text>
    <text x="44" y="68" fill="#fabd2f">EyeWear // RSA CHALLENGE</text>
    <text x="596" y="52" text-anchor="end" fill="#fe8019">bbOCR // 99.4% CONF</text>
    <text x="596" y="68" text-anchor="end">LIVE WebRTC PIPELINE</text>
  </g>

  <!-- Optical HUD / Viewfinder Reticle Structure -->
  <g transform="translate(320, 180)">
    <!-- Concentric Reticle Rings -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#504945" stroke-width="1" stroke-dasharray="6 6" />
    <circle cx="0" cy="0" r="50" fill="none" stroke="#fabd2f" stroke-width="1" opacity="0.5" />
    <circle cx="0" cy="0" r="20" fill="#282828" stroke="#fe8019" stroke-width="1.5" />
    <circle cx="0" cy="0" r="3" fill="#fabd2f" />

    <!-- Crosshair Ticks -->
    <line x1="-100" y1="0" x2="-60" y2="0" stroke="#fabd2f" stroke-width="1.5" />
    <line x1="60" y1="0" x2="100" y2="0" stroke="#fabd2f" stroke-width="1.5" />
    <line x1="0" y1="-70" x2="0" y2="-40" stroke="#fabd2f" stroke-width="1.5" />
    <line x1="0" y1="40" x2="0" y2="70" stroke="#fabd2f" stroke-width="1.5" />

    <!-- Target Bounding Box Viewfinder -->
    <path d="M -130 -40 L -140 -40 L -140 -30" fill="none" stroke="#fabd2f" stroke-width="2" />
    <path d="M 130 -40 L 140 -40 L 140 -30" fill="none" stroke="#fabd2f" stroke-width="2" />
    <path d="M -130 40 L -140 40 L -140 30" fill="none" stroke="#fabd2f" stroke-width="2" />
    <path d="M 130 40 L 140 40 L 140 30" fill="none" stroke="#fabd2f" stroke-width="2" />

    <text x="-135" y="-46" font-family="ui-monospace, monospace" font-size="9" fill="#fabd2f">[TARGET ACQUIRED: TEXT_BLOCK]</text>
  </g>

  <!-- Technical Code Cadence Ticker at Bottom -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#665c54">
    <text x="44" y="318">&gt; bbOCR::infer_frame(rtc_stream) [LATENCY: 18ms // 60 FPS]</text>
    <text x="596" y="318" text-anchor="end" fill="#b8bb26">● STREAM LOCK</text>
  </g>
</svg>