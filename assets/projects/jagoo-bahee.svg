<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#3c3836" />
    </pattern>
    <pattern id="grid-cad" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#282828" stroke-width="1" />
    </pattern>
    <linearGradient id="fade-glow-aqua" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ec07c" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#83a598" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="640" height="360" fill="#1d2021" />
  <rect width="640" height="360" fill="url(#grid-cad)" />
  <rect width="640" height="360" fill="url(#grid-dots)" opacity="0.6" />
  <rect x="24" y="24" width="592" height="312" fill="url(#fade-glow-aqua)" rx="4" />

  <!-- Outer Technical CAD Boundary -->
  <rect x="24" y="24" width="592" height="312" fill="none" stroke="#3c3836" stroke-width="1" stroke-dasharray="8 4" />

  <!-- Technical Corner Marks -->
  <path d="M 20 36 L 20 20 L 36 20" fill="none" stroke="#8ec07c" stroke-width="2" />
  <path d="M 620 36 L 620 20 L 604 20" fill="none" stroke="#8ec07c" stroke-width="2" />
  <path d="M 20 324 L 20 340 L 36 340" fill="none" stroke="#8ec07c" stroke-width="2" />
  <path d="M 620 324 L 620 340 L 604 340" fill="none" stroke="#8ec07c" stroke-width="2" />

  <!-- Technical Monospace Headers -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#928374">
    <text x="44" y="52">0x01 // PKG.TYPESCRIPT</text>
    <text x="44" y="68" fill="#b8bb26">@tasmirz/jagoo-bahee</text>
    <text x="596" y="52" text-anchor="end" fill="#83a598">160+ STARS // ACTIVE</text>
    <text x="596" y="68" text-anchor="end">AST &amp; PIPELINE ENGINE</text>
  </g>

  <!-- Center Abstract AST / Graph Structure -->
  <g transform="translate(60, 40)">
    <!-- Connecting Edges -->
    <path d="M 160 140 L 260 90 L 360 140 L 260 190 Z" fill="none" stroke="#504945" stroke-width="1.5" />
    <path d="M 100 140 L 160 140" fill="none" stroke="#8ec07c" stroke-width="1.5" stroke-dasharray="4 3" />
    <path d="M 360 140 L 420 140" fill="none" stroke="#8ec07c" stroke-width="1.5" stroke-dasharray="4 3" />
    <path d="M 260 90 L 260 40" fill="none" stroke="#b8bb26" stroke-width="1.5" stroke-dasharray="4 3" />
    <path d="M 260 190 L 260 230" fill="none" stroke="#83a598" stroke-width="1.5" stroke-dasharray="4 3" />

    <!-- Node Dots & Badges -->
    <circle cx="260" cy="140" r="16" fill="#282828" stroke="#8ec07c" stroke-width="2" />
    <circle cx="260" cy="140" r="4" fill="#8ec07c" />

    <circle cx="160" cy="140" r="8" fill="#282828" stroke="#b8bb26" stroke-width="1.5" />
    <circle cx="360" cy="140" r="8" fill="#282828" stroke="#83a598" stroke-width="1.5" />
    <circle cx="260" cy="90" r="8" fill="#282828" stroke="#fabd2f" stroke-width="1.5" />
    <circle cx="260" cy="190" r="8" fill="#282828" stroke="#d3869b" stroke-width="1.5" />

    <circle cx="100" cy="140" r="4" fill="#928374" />
    <circle cx="420" cy="140" r="4" fill="#928374" />
    <circle cx="260" cy="40" r="4" fill="#928374" />
    <circle cx="260" cy="230" r="4" fill="#928374" />
  </g>

  <!-- Technical Code Cadence Ticker at Bottom -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#665c54">
    <text x="44" y="318">&gt; fn compile(src: AST) -&gt; Stream&lt;Bytecode&gt; [OPTIMIZED: 0.14ms]</text>
    <text x="596" y="318" text-anchor="end" fill="#8ec07c">● READY</text>
  </g>
</svg>