<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid-dots-chirkut" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#3c3836" />
    </pattern>
    <pattern id="grid-cad-chirkut" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#282828" stroke-width="1" />
    </pattern>
    <linearGradient id="fade-glow-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#83a598" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#b8bb26" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="640" height="360" fill="#1d2021" />
  <rect width="640" height="360" fill="url(#grid-cad-chirkut)" />
  <rect width="640" height="360" fill="url(#grid-dots-chirkut)" opacity="0.6" />
  <rect x="24" y="24" width="592" height="312" fill="url(#fade-glow-teal)" rx="4" />

  <!-- Outer Technical CAD Boundary -->
  <rect x="24" y="24" width="592" height="312" fill="none" stroke="#3c3836" stroke-width="1" stroke-dasharray="8 4" />

  <!-- Technical Corner Marks -->
  <path d="M 20 36 L 20 20 L 36 20" fill="none" stroke="#83a598" stroke-width="2" />
  <path d="M 620 36 L 620 20 L 604 20" fill="none" stroke="#83a598" stroke-width="2" />
  <path d="M 20 324 L 20 340 L 36 340" fill="none" stroke="#83a598" stroke-width="2" />
  <path d="M 620 324 L 620 340 L 604 340" fill="none" stroke="#83a598" stroke-width="2" />

  <!-- Technical Monospace Headers -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#928374">
    <text x="44" y="52">0x07 // CRYPTO.ZERO-KNOWLEDGE</text>
    <text x="44" y="68" fill="#83a598">Chirkut // E2EE ANONYMOUS MESH</text>
    <text x="596" y="52" text-anchor="end" fill="#b8bb26">ED25519 // ZK-SNARK</text>
    <text x="596" y="68" text-anchor="end">DOUBLE RATCHET PROTOCOL</text>
  </g>

  <!-- Cryptographic Central Schematic -->
  <g transform="translate(320, 180)">
    <!-- Encrypted Note / Envelope Outline -->
    <rect x="-110" y="-60" width="220" height="120" rx="6" fill="#282828" stroke="#504945" stroke-width="1.5" />
    <path d="M -110 -60 L 0 10 L 110 -60" fill="none" stroke="#83a598" stroke-width="1.5" stroke-dasharray="6 3" />
    <line x1="-110" y1="60" x2="-30" y2="-5" stroke="#3c3836" stroke-width="1" />
    <line x1="110" y1="60" x2="30" y2="-5" stroke="#3c3836" stroke-width="1" />

    <!-- Central Security Padlock Shield -->
    <circle cx="0" cy="12" r="32" fill="#1d2021" stroke="#83a598" stroke-width="2" />
    <!-- Padlock Shackle -->
    <path d="M -12 6 L -12 -6 A 12 12 0 0 1 12 -6 L 12 6" fill="none" stroke="#fabd2f" stroke-width="3" stroke-linecap="round" />
    <!-- Padlock Body -->
    <rect x="-16" y="4" width="32" height="22" rx="3" fill="#3c3836" stroke="#fabd2f" stroke-width="1.5" />
    <!-- Keyhole -->
    <circle cx="0" cy="13" r="2.5" fill="#fabd2f" />
    <path d="M -1.5 14 L 1.5 14 L 2.5 21 L -2.5 21 Z" fill="#fabd2f" />

    <!-- Cipher Key Ring Markers -->
    <circle cx="-160" cy="0" r="16" fill="#282828" stroke="#b8bb26" stroke-width="1" />
    <path d="M -160 -10 L -160 10 M -170 0 L -150 0" stroke="#b8bb26" stroke-width="1" />
    <text x="-160" y="28" font-family="ui-monospace, monospace" font-size="9" fill="#928374" text-anchor="middle">Alice [k_A]</text>
    <line x1="-140" y1="0" x2="-115" y2="0" stroke="#b8bb26" stroke-width="1.5" stroke-dasharray="4 2" />

    <circle cx="160" cy="0" r="16" fill="#282828" stroke="#fe8019" stroke-width="1" />
    <path d="M 160 -10 L 160 10 M 150 0 L 170 0" stroke="#fe8019" stroke-width="1" />
    <text x="160" y="28" font-family="ui-monospace, monospace" font-size="9" fill="#928374" text-anchor="middle">Bob [k_B]</text>
    <line x1="115" y1="0" x2="140" y2="0" stroke="#fe8019" stroke-width="1.5" stroke-dasharray="4 2" />

    <!-- Status Badge inside schematic -->
    <text x="0" y="-72" font-family="ui-monospace, monospace" font-size="10" fill="#fabd2f" text-anchor="middle">[EPHEMERAL PAYLOAD // FORWARD SECRECY]</text>
  </g>

  <!-- Technical Code Cadence Ticker at Bottom -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#665c54">
    <text x="44" y="318">&gt; chirkut::ratchet_send(cipher_envelope) [PFS: TRUE // ZERO METADATA]</text>
    <text x="596" y="318" text-anchor="end" fill="#b8bb26">● ZERO-KNOWLEDGE PROOF</text>
  </g>
</svg>
