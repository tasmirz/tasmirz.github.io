<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cpuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282828" />
      <stop offset="100%" stop-color="#1d2021" />
    </linearGradient>
    <linearGradient id="busGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fe8019" />
      <stop offset="100%" stop-color="#fabd2f" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#cpuBg)" />

  <!-- Hardware Schematic Grid -->
  <g stroke="#3c3836" stroke-width="1" opacity="0.4">
    <line x1="50" y1="0" x2="50" y2="360" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="350" y1="0" x2="350" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
  </g>

  <!-- 5-Stage Pipeline Registers -->
  <g transform="translate(60, 45)">
    <!-- Stage Blocks -->
    <rect x="0" y="30" width="70" height="60" rx="4" fill="#3c3836" stroke="#fe8019" stroke-width="1.5" />
    <text x="35" y="65" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#ebdbb2" text-anchor="middle">IF</text>

    <path d="M 70 60 H 100" stroke="url(#busGradient)" stroke-width="3" />

    <rect x="100" y="30" width="70" height="60" rx="4" fill="#3c3836" stroke="#fe8019" stroke-width="1.5" />
    <text x="135" y="65" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#ebdbb2" text-anchor="middle">ID</text>

    <path d="M 170 60 H 200" stroke="url(#busGradient)" stroke-width="3" />

    <!-- ALU / EX unit -->
    <polygon points="200,30 260,45 280,30 280,90 260,75 200,90" fill="#32302f" stroke="#fabd2f" stroke-width="2" />
    <text x="240" y="65" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#fabd2f" text-anchor="middle">ALU</text>

    <path d="M 280 60 H 310" stroke="url(#busGradient)" stroke-width="3" />

    <rect x="310" y="30" width="70" height="60" rx="4" fill="#3c3836" stroke="#fe8019" stroke-width="1.5" />
    <text x="345" y="65" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#ebdbb2" text-anchor="middle">MEM</text>

    <path d="M 380 60 H 410" stroke="url(#busGradient)" stroke-width="3" />

    <rect x="410" y="30" width="70" height="60" rx="4" fill="#3c3836" stroke="#fe8019" stroke-width="1.5" />
    <text x="445" y="65" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#ebdbb2" text-anchor="middle">WB</text>

    <!-- Clock cycle waveform -->
    <path d="M 0 130 H 40 V 110 H 80 V 130 H 120 V 110 H 160 V 130 H 200 V 110 H 240 V 130 H 280 V 110 H 320 V 130 H 360 V 110 H 400 V 130 H 440 V 110 H 480" fill="none" stroke="#83a598" stroke-width="1.5" opacity="0.7" />
    <text x="495" y="125" font-family="'Courier New', monospace" font-size="10" fill="#83a598">CLK</text>
  </g>

  <!-- Project Banner -->
  <rect x="50" y="220" width="500" height="95" rx="10" fill="#32302f" fill-opacity="0.9" stroke="#504945" stroke-width="1.5" />
  <text x="75" y="260" font-family="'Courier New', monospace" font-size="24" font-weight="bold" fill="#fbf1c7">Computer</text>
  <text x="75" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#a89984">29-Bit 5-Stage Pipelined RISC Architecture with Assembler</text>

  <rect x="440" y="243" width="90" height="26" rx="5" fill="#3c3836" stroke="#fe8019" stroke-width="1" />
  <text x="485" y="260" font-family="'Courier New', monospace" font-size="12" fill="#fe8019" text-anchor="middle">Hardware</text>
</svg>
